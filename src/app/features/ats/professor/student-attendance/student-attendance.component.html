<main class="mx-auto w-full space-y-8 animate-fadeIn">
  <div class="space-y-2 text-center md:text-left">
    <h2 class="text-xl font-black tracking-tighter text-blue-600 dark:text-blue-400">
      Student Attendance
    </h2>
    <p class="text-slate-500 dark:text-slate-400 font-medium text-sm">
      Monitor and update student attendance records
    </p>
  </div>

  <div class="flex px-4 sm:px-6 pb-6">
    <div class="w-full space-y-6">
      <section
        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm"
      >
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
          <!-- Subject -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
              Subject
            </label>

            <select
              class="h-11 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
              [(ngModel)]="selectedSubjectId"
              (ngModelChange)="onFilterChange()"
            >
              <option *ngFor="let option of subjectOptions" [ngValue]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>

          <!-- Section -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
              Section
            </label>

            <select
              class="h-11 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
              [(ngModel)]="selectedSectionId"
              (ngModelChange)="onFilterChange()"
            >
              <option *ngFor="let option of sectionOptions" [ngValue]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>

          <!-- Date -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
              Date From
            </label>

            <ng-container *ngIf="isBrowser; else dateFromFallback">
              <p-datepicker
                [(ngModel)]="selectedDateFrom"
                (ngModelChange)="onFilterChange()"
                dateFormat="yy-mm-dd"
                [showIcon]="true"
                [showButtonBar]="true"
                [appendTo]="'body'"
                placeholder="Date from"
                styleClass="attendance-date-picker w-full"
                inputStyleClass="h-11 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
              />
            </ng-container>

            <ng-template #dateFromFallback>
              <input
                type="text"
                disabled
                placeholder="Date from"
                class="h-11 w-full rounded-xl border border-slate-300 px-3 text-sm"
              />
            </ng-template>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
              Date To
            </label>

            <ng-container *ngIf="isBrowser; else dateToFallback">
              <p-datepicker
                [(ngModel)]="selectedDateTo"
                (ngModelChange)="onFilterChange()"
                dateFormat="yy-mm-dd"
                [showIcon]="true"
                [showButtonBar]="true"
                [appendTo]="'body'"
                placeholder="Date to"
                styleClass="attendance-date-picker w-full"
                inputStyleClass="h-11 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 text-sm text-slate-700 dark:text-slate-200 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
              />
            </ng-container>

            <ng-template #dateToFallback>
              <input
                type="text"
                disabled
                placeholder="Date to"
                class="h-11 w-full rounded-xl border border-slate-300 px-3 text-sm"
              />
            </ng-template>
          </div>

          <!-- Clear Button -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-transparent select-none"> Action </label>

            <button
              type="button"
              (click)="clearFilters()"
              class="h-11 w-full rounded-xl border border-slate-300 bg-slate-100 px-3 text-sm font-semibold text-slate-700 hover:bg-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 transition"
            >
              Clear Filters
            </button>
          </div>
        </div>
      </section>

      <sti-data-table
        [title]="'Student Attendance Records'"
        [subtitle]="'List of students attendance per subject'"
        [value]="attendanceRecords"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading"
        [striped]="true"
        [rowHover]="true"
        [showColumnFilters]="false"
        [showActions]="true"
        [showImportCsv]="false"
        [showAdd]="false"
        [showDelete]="false"
        [showSelection]="false"
        [showExportPdf]="true"
        [exportPdfLabel]="'Export PDF'"
        [exportPdfFileName]="attendanceExportFileName"
        [exportPdfTitle]="'Student Attendance Records'"
        [exportPdfSubtitle]="'List of students attendance per subject'"
        [exportPdfMeta]="attendanceExportMeta"
        [paginator]="true"
        [rows]="rows"
        [first]="first"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [rowsPerPageOptions]="[10, 25, 50]"
        (rowClicked)="onRowClicked($event)"
        (pageChanged)="onPageChanged($event)"
        (actionClicked)="onActionClicked($event)"
      >
      </sti-data-table>
    </div>
  </div>
</main>

<p-dialog
  [(visible)]="visible"
  (onShow)="onDialogShown()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: 'min(500px, 95vw)' }"
  [contentStyle]="{ 'max-height': '78vh', overflow: 'auto' }"
  (onHide)="close()"
>
  <!-- HEADER -->
  <ng-template pTemplate="header">
    <div class="w-full flex items-center justify-center">
      <div class="text-lg font-bold text-blue-600">
        {{ dialogTitle }}
      </div>
    </div>
  </ng-template>

  <!-- FORM -->
  <form
    #studentParentForm="ngForm"
    (ngSubmit)="onSave(studentParentForm)"
    class="p-4"
  >
    <div class="space-y-5">

      <!-- STUDENT -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          <span class="text-red-600 mr-1" *ngIf="mode !== 'VIEW'">*</span>
          Student:
        </label>

        <!-- VIEW MODE -->
        <ng-container *ngIf="mode === 'VIEW'; else studentSelectTpl">
          <div class="w-full px-3 py-2 text-sm text-slate-700">
            {{ student_name || '-' }}
          </div>
        </ng-container>

        <!-- ADD / UPDATE MODE -->
        <ng-template #studentSelectTpl>
          <p-select
            name="student_id"
            [(ngModel)]="student_id"
            #studentCtrl="ngModel"
            [options]="studentOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            placeholder="Search Student"
            [disabled]="loadingOptions"
            required
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty':
                studentCtrl.invalid &&
                (studentCtrl.touched || submitted)
            }"
          >
          </p-select>

          <p
            class="mt-1 text-xs text-rose-600"
            *ngIf="studentCtrl.invalid && (studentCtrl.touched || submitted)"
          >
            Student is required.
          </p>
        </ng-template>
      </div>

      <!-- PARENT -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          <span class="text-red-600 mr-1" *ngIf="mode !== 'VIEW'">*</span>
          Parent:
        </label>

        <!-- VIEW MODE -->
        <ng-container *ngIf="mode === 'VIEW'; else parentSelectTpl">
          <div class="w-full px-3 py-2 text-sm text-slate-700">
            {{ parent_name || '-' }}
          </div>
        </ng-container>

        <!-- ADD / UPDATE MODE -->
        <ng-template #parentSelectTpl>
          <p-select
            name="parent_id"
            [(ngModel)]="parent_id"
            #parentCtrl="ngModel"
            [options]="parentOptions"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            placeholder="Search Parent"
            [disabled]="loadingOptions"
            required
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty':
                parentCtrl.invalid &&
                (parentCtrl.touched || submitted)
            }"
          >
          </p-select>

          <p
            class="mt-1 text-xs text-rose-600"
            *ngIf="parentCtrl.invalid && (parentCtrl.touched || submitted)"
          >
            Parent is required.
          </p>
        </ng-template>
      </div>

    </div>

    <!-- FOOTER -->
    <div
      *ngIf="mode !== 'VIEW'"
      class="flex justify-end gap-3 mt-6"
    >

      <button
        pButton
        type="button"
        label="Cancel"
        class="!bg-slate-100 !border-slate-300 !text-slate-700 hover:!bg-slate-200"
        (click)="close()"
      ></button>

      <button
        pButton
        type="submit"
        label="Save"
        class="!bg-blue-600 !border-blue-600 !text-white hover:!bg-blue-700"
      ></button>

    </div>
  </form>
</p-dialog>
